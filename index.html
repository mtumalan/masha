<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M.A.S.H.A.</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style>
    :root{
      --bg:#0b0e14; --ink:#e6e8ef; --muted:#9aa3b2; --panel:#111521; --border:#1e2636;
      --good:#1fb970; --bad:#e0526b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica,Arial,sans-serif}
    .wrap{max-width:1000px;margin:32px auto;padding:0 16px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
    h1{font-size:18px;margin:0}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}

    .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
    .cal-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .cal-title h2{margin:0;font-size:15px}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #2a3244;border-radius:999px;background:#0d111a;font-size:12px;color:var(--ink)}
    .badge.positive{border-color:var(--good);color:var(--good)}
    .badge.negative{border-color:var(--bad);color:var(--bad)}
    button{background:#0d111a;color:var(--ink);border:1px solid #2a3244;border-radius:10px;padding:8px 10px;cursor:pointer}
    button:hover{background:#232b3b}

    .seg{display:inline-flex;border:1px solid #2a3244;border-radius:10px;overflow:hidden}
    .seg button{padding:6px 10px;border:0;background:#0d111a}
    .seg button.active{background:#1a2234;border-left:1px solid #2a3244;border-right:1px solid #2a3244}

    .cal-scroll{overflow:auto; -webkit-overflow-scrolling:touch}
    .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:8px;min-width:630px}
    .cal-dow{font-size:11px;color:var(--muted);text-align:center;padding:6px 0;position:sticky;top:0;background:var(--panel);z-index:1}

    .day{background:#1a2234;border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;aspect-ratio:1/1}
    .day.other{opacity:.35}
    .day .n{font-size:12px;color:var(--muted)}
    .day .u{margin-top:auto;font-weight:700}

    @media (max-width: 900px){
      .wrap{padding:0 12px}
      .cal-grid{grid-template-columns:repeat(7,minmax(70px,1fr));gap:6px;min-width:490px}
      .day{aspect-ratio:1/1;}
    }
    @media (max-width: 600px){
      .cal-top{flex-direction:column;align-items:flex-start}
      .cal-grid{grid-template-columns:repeat(7,minmax(56px,1fr));gap:5px;min-width:392px}
      .day{padding:8px;}
      .day .n{font-size:11px}
      .day .u{font-size:12px}
      h1{font-size:16px}
      .cal-title h2{font-size:14px}
      .badge{font-size:11px;padding:5px 8px}
      button{padding:6px 8px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

      <span id="clientPayout" class="badge">Payout mes: — MXN</span>

<script>
// ===== Config =====
const _TS         = Date.now();
// Era nueva (anette, desde 2026-08-31): filas por bet liquidado que escribe
// export_results.py a las :01. Las eras viejas (results.csv / meta_results.csv)
// quedaron CONGELADAS en HISTORICAL_DAILY (calculadas con la logica original
// de esta misma pagina el 2026-08-30) y ya no se leen.
const CSV_NEW       = `data/anette_results.csv?_=${_TS}`;
const NEW_ERA_START = '2026-08-31';
const COINS       = ['BTCUSDT', 'XRPUSDT', 'ETHUSDT'];
const UNIT_OLD    = 50;
const UNIT_META   = 130;
const CUTOFF_DATE = '2026-05-26';

// MXN por unidad por cada 10k MXN invertidos
const CLIENT_MXN_PER_UNIT_PER_10K = 70;

// Ajustes manuales de unidades por día (UTC, 'YYYY-MM-DD').
// Positivo = suma unidades, negativo = resta unidades.
// Se aplican sobre el total del día (y por lo tanto sobre el total del mes).
// (los ajustes previos al 2026-08-31 ya estan horneados en HISTORICAL_DAILY)
const UNIT_ADJUSTMENTS = {};

const $$ = (s, r=document) => r.querySelector(s);
const fmtNum = (n) => new Intl.NumberFormat('es-MX', {maximumFractionDigits:2}).format(n);

let ROWS = [];
let CAL_CURRENT = null;
let MODE = 'trade';

// ── Parsing helpers ───────────────────────────────────────────────────────────

function toNumber(x){
  if(x===null||x===undefined||x==='') return null;
  if(typeof x === 'string'){
    const t = x.trim().toLowerCase();
    if(['nan','-inf','inf','infinity','-infinity'].includes(t)) return null;
  }
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
}

function parseTsAsUTC(x){
  if(x == null) return new Date(NaN);
  const s = String(x).trim();
  if(/[zZ]|[+\-]\d{2}:?\d{2}$/.test(s)) return new Date(s);
  return new Date(s.replace(' ','T') + 'Z');
}

function ymdUTC(d){
  return d.getUTCFullYear() + '-'
    + String(d.getUTCMonth()+1).padStart(2,'0') + '-'
    + String(d.getUTCDate()).padStart(2,'0');
}

// ── Old-data (results.csv) computation rules — mirrors kazam.html ────────────
const TH = { "BTCUSDT": 0.51599, "ETHUSDT": 0.509294, "XRPUSDT": 0.50813 };
const PROFIT_F              = 0.885;
const XRP_PAYOUT_START_UTC  = "2026-04-16";
const XRP_PROFIT_F          = 0.851;
const XRP_THRESHOLD_F       = 0.52217;
const STAKE_MULT_BY_WEEKDAY = { "Wednesday": 1.5, "Saturday": 2.25 };
const STAKE_MULT_BY_DATE    = { "2026-02-06": 0.0 };
const WED_NO_MULT_START_UTC = "2026-03-01";
const THU_OFF_START_UTC     = "2026-02-01";

function weekdayNameUTC(d){
  return new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'UTC'}).format(d);
}
function profitFactorForCoin(coin, ymd){
  return (coin === "XRPUSDT" && ymd >= XRP_PAYOUT_START_UTC) ? XRP_PROFIT_F : PROFIT_F;
}
function thresholdForCoin(coin, ymd){
  const base = TH[coin];
  if(base === undefined) return undefined;
  return (coin === "XRPUSDT" && ymd >= XRP_PAYOUT_START_UTC) ? XRP_THRESHOLD_F : base;
}
function stakeMultForDate(d){
  const ymd = ymdUTC(d);
  if(Object.prototype.hasOwnProperty.call(STAKE_MULT_BY_DATE, ymd)) return Number(STAKE_MULT_BY_DATE[ymd]);
  const wd = weekdayNameUTC(d);
  if(wd === "Wednesday" && ymd >= WED_NO_MULT_START_UTC) return 1.0;
  if(wd === "Thursday"  && ymd >= THU_OFF_START_UTC)     return 0.0;
  return Number(STAKE_MULT_BY_WEEKDAY[wd] ?? 1.0);
}
function computeSignal(pu, pd, th){
  if(pu >= th && pu >= pd) return 1;
  if(pd >= th && pd >= pu) return -1;
  return 0;
}
function listCoins(headers){
  const s = new Set();
  for(const h of headers){
    if(h.startsWith('prob_up_'))   s.add(h.slice(8));
    if(h.startsWith('prob_down_')) s.add(h.slice(10));
    if(h.startsWith('actual_'))    s.add(h.slice(7));
    if(h.startsWith('signal_'))    s.add(h.slice(7));
  }
  const arr = [...s].sort();
  return arr.length ? arr : COINS.slice();
}

// Old data: re-compute PnL from prob/actual using kazam rules; rows < CUTOFF_DATE
function buildOldRows(rawRows){
  if(!rawRows?.length) return [];
  const headers = Object.keys(rawRows[0]);
  const coins   = listCoins(headers);
  const tmp = [];
  for(const r of rawRows){
    const t = parseTsAsUTC(r['timestamp']);
    if(isNaN(t)) continue;
    if(t.getUTCDay() === 1 && t.getUTCHours() === 0) continue;
    const ymd = ymdUTC(t);
    if(ymd >= CUTOFF_DATE) continue;

    const mult = stakeMultForDate(t);
    let pnl = 0, trades = 0;
    for(const c of coins){
      const puRaw  = toNumber(r['prob_up_'+c]);
      const pdRaw  = toNumber(r['prob_down_'+c]);
      const actRaw = toNumber(r['actual_'+c]);
      const actual = actRaw === null ? 0 : (actRaw | 0);

      let signal;
      const th = thresholdForCoin(c, ymd);
      if((('prob_up_'+c) in r || ('prob_down_'+c) in r) && th !== undefined){
        signal = computeSignal(puRaw === null ? -Infinity : puRaw, pdRaw === null ? -Infinity : pdRaw, th);
      } else {
        const sigRaw = toNumber(r['signal_'+c]);
        signal = sigRaw === null ? 0 : (sigRaw | 0);
        if(signal !== -1 && signal !== 0 && signal !== 1) signal = 0;
      }

      if(signal !== 0){
        const hit = signal === actual;
        pnl += hit ? UNIT_OLD * mult * profitFactorForCoin(c, ymd) : -UNIT_OLD * mult;
        trades++;
      }
    }

    const hourISO = new Date(Date.UTC(
      t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate(), t.getUTCHours()
    )).toISOString();

    tmp.push({ tsISO: t.toISOString(), hourISO, u_total: pnl / UNIT_OLD, trades });
  }
  return tmp;
}

// New data: read pre-computed pnl_total directly; rows >= CUTOFF_DATE
function buildMetaRows(rawRows){
  if(!rawRows?.length) return [];
  const tmp = [];
  for(const r of rawRows){
    const t = parseTsAsUTC(r['timestamp']);
    if(isNaN(t)) continue;
    if(t.getUTCDay() === 1 && t.getUTCHours() === 0) continue;
    const ymd = ymdUTC(t);
    if(ymd < CUTOFF_DATE) continue;

    const u_total = (toNumber(r['pnl_total']) ?? 0) / UNIT_META;

    let trades = 0;
    for(const c of COINS){
      const sig = toNumber(r[`signal_${c}`]);
      if(sig !== null && sig !== 0) trades++;
    }

    const hourISO = new Date(Date.UTC(
      t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate(), t.getUTCHours()
    )).toISOString();

    tmp.push({ tsISO: t.toISOString(), hourISO, u_total, trades });
  }
  return tmp;
}

// Era nueva: data/anette_results.csv — una fila por bet liquidado:
// timestamp,symbol,pred,win,stake,pnl,units,paper. Solo filas reales (paper=0)
// y fechas >= NEW_ERA_START. u por bet = pnl/stake (gana +0.8182, pierde -1).
function buildNewRows(rawRows){
  if(!rawRows?.length) return [];
  const byHour = new Map();
  for(const r of rawRows){
    const t = parseTsAsUTC(r['timestamp']);
    if(isNaN(t)) continue;
    if(Number(r['paper'])) continue;
    if(ymdUTC(t) < NEW_ERA_START) continue;
    const hourISO = new Date(Date.UTC(
      t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate(), t.getUTCHours()
    )).toISOString();
    const o = byHour.get(hourISO) || {u:0, trades:0};
    o.u += toNumber(r['units']) ?? 0;
    o.trades += 1;
    byHour.set(hourISO, o);
  }
  return [...byHour.entries()]
    .sort((a,b)=>a[0]<b[0]?-1:1)
    .map(([hourISO,o]) => ({tsISO: hourISO, hourISO, u_total: o.u, trades: o.trades}));
}

    const d = new Date(r.tsISO);
    const key = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString().slice(0,10);
    const o = byDay.get(key) || {u:0, hours:0, trades:0};
    o.u      += r.u_total;
    o.hours  += (r.trades > 0 ? 1 : 0);
    o.trades += r.trades;
    byDay.set(key, o);
  }

  // Ajustes manuales: crean el día si no existe en los datos
  for(const [key, delta] of Object.entries(UNIT_ADJUSTMENTS)){
    const n = toNumber(delta);
    if(n === null || n === 0) continue;
    const o = byDay.get(key) || {u:0, hours:0, trades:0};
    o.u += n;
    byDay.set(key, o);
  }

  return byDay;
}

// ── Client payout ─────────────────────────────────────────────────────────────

function getBankMXN(){
  const v = Number($$('#bankInput')?.value);
  return Number.isFinite(v) && v >= 0 ? v : 0;
}

function updateClientPayoutBadge(monthUnits){
  const el = $$('#clientPayout');
  if(!el) return;
  const payout = monthUnits * CLIENT_MXN_PER_UNIT_PER_10K * (getBankMXN() / 10_000);
  const sign = payout > 0 ? '+' : '';
  el.textContent = `Payout mes: ${sign}${new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(payout)} MXN`;
  el.classList.toggle('positive', payout > 0);
  el.classList.toggle('negative', payout < 0);
}

// ── Render calendar ───────────────────────────────────────────────────────────

function renderCalendar(){
  if(!CAL_CURRENT){ updateClientPayoutBadge(0); return 0; }

  const year  = CAL_CURRENT.getUTCFullYear();
  const month = CAL_CURRENT.getUTCMonth();
  const first = new Date(Date.UTC(year, month, 1));
  const dow   = first.getUTCDay();
  const start = new Date(Date.UTC(year, month, 1 + (dow === 0 ? -6 : 1 - dow)));

  const byDay      = summarizeByDay_Hours(ROWS);
  const rightLabel = MODE === 'trade' ? 'Trades' : 'Horas';

  const titleEl = $$('#calTitle');
  if(titleEl) titleEl.textContent = new Intl.DateTimeFormat('es-MX', {month:'long', year:'numeric', timeZone:'UTC'}).format(first);

  const grid = $$('#calGrid');
  if(!grid){ updateClientPayoutBadge(0); return 0; }
  grid.innerHTML = '<div class="cal-dow">Lun</div><div class="cal-dow">Mar</div><div class="cal-dow">Mié</div><div class="cal-dow">Jue</div><div class="cal-dow">Vie</div><div class="cal-dow">Sáb</div><div class="cal-dow">Dom</div>';

  const daysInMonth = new Date(Date.UTC(year, month+1, 0)).getUTCDate();
  const vals = [];
  for(let d=1; d<=daysInMonth; d++){
    const key = new Date(Date.UTC(year, month, d)).toISOString().slice(0,10);
    vals.push(Math.abs(byDay.get(key)?.u || 0));
  }
  const maxAbs = Math.max(0, ...vals);

  let monthUnits = 0, monthCount = 0;
  for(let i=0; i<42; i++){
    const d = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate()+i));
    const key = d.toISOString().slice(0,10);
    const inMonth = d.getUTCMonth() === month;
    const rec = byDay.get(key) || {u:0, hours:0, trades:0};

    if(inMonth){
      monthUnits += rec.u;
      monthCount += (MODE === 'trade') ? rec.trades : rec.hours;
    }

    const u = rec.u;
    const alpha = maxAbs > 0 ? (0.18 + 0.72 * Math.min(1, Math.abs(u) / maxAbs)) : 0;
    let bg, border;
    if(u > 0)     { bg=`rgba(31,185,112,${alpha})`;  border='rgba(31,185,112,.55)'; }
    else if(u < 0){ bg=`rgba(224,82,107,${alpha})`;  border='rgba(224,82,107,.55)'; }
    else          { bg='#1a2234';                     border='var(--border)'; }

    const div = document.createElement('div');
    div.className = 'day' + (inMonth ? '' : ' other');
    div.style.background  = u === 0 ? bg : `linear-gradient(180deg, ${bg}, rgba(0,0,0,.08))`;
    div.style.borderColor = border;
    div.innerHTML = `<div class="n">${d.getUTCDate()}</div><div class="u">${u>0?'+'+fmtNum(u):u<0?fmtNum(u):'—'} u</div>`;
    grid.appendChild(div);
  }

  const badge = $$('#monthUnits');
  if(badge){
    badge.textContent = `Mes: ${monthUnits>0?'+'+fmtNum(monthUnits):fmtNum(monthUnits)} u`;
    badge.classList.toggle('positive', monthUnits > 0);
    badge.classList.toggle('negative', monthUnits < 0);
  }
  const mt = $$('#monthTrades');
  if(mt) mt.textContent = `${rightLabel}: ${new Intl.NumberFormat('es-MX').format(monthCount)}`;

  updateClientPayoutBadge(monthUnits);
  return monthUnits;
}

// ── Load & boot ───────────────────────────────────────────────────────────────

function fetchCSV(path){
  return new Promise((res,rej) => {
    Papa.parse(path, {
      header:true, dynamicTyping:true, download:true, skipEmptyLines:true,
      complete:(o) => res(o.data), error:(e) => rej(e),
    });
  });
}

(async () => {
  try{
    const rawNew = await fetchCSV(CSV_NEW).catch(() => []);
    ROWS = buildNewRows(rawNew);

    const histKeys = Object.keys(HISTORICAL_DAILY).sort();
    const lastISO = ROWS.length ? ROWS[ROWS.length-1].tsISO
                                : histKeys[histKeys.length-1] + 'T00:00:00Z';
    const dLast = new Date(lastISO);
    CAL_CURRENT = new Date(Date.UTC(dLast.getUTCFullYear(), dLast.getUTCMonth(), 1));
    renderCalendar();
  }catch(e){
    console.error(e);
  }
})();

// ── Events ────────────────────────────────────────────────────────────────────

$$('#prevMonth')?.addEventListener('click', () => {
  if(!CAL_CURRENT) return;
  CAL_CURRENT = new Date(Date.UTC(CAL_CURRENT.getUTCFullYear(), CAL_CURRENT.getUTCMonth()-1, 1));
  renderCalendar();
});
$$('#nextMonth')?.addEventListener('click', () => {
  if(!CAL_CURRENT) return;
  CAL_CURRENT = new Date(Date.UTC(CAL_CURRENT.getUTCFullYear(), CAL_CURRENT.getUTCMonth()+1, 1));
  renderCalendar();
});

$$('#bankInput')?.addEventListener('input', () => renderCalendar());

document.querySelectorAll('#modeSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    MODE = btn.dataset.mode;
    renderCalendar();
  });
});
</script>
